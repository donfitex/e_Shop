<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Mart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F1F4F3;--ink:#1F2A44;--mute:#5E6B7A;--line:#CBD5D3;--accent:#2B4FD8;--r:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;align-items:center;gap:1.25rem;padding:1rem 5vw;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-weight:700;font-size:1.3rem;margin-right:auto;color:inherit;text-decoration:none}
a{color:var(--accent)} nav a{color:var(--ink);text-decoration:none}
nav a:hover,nav a:focus-visible{text-decoration:underline}
main{padding:2rem 5vw 4rem;max-width:1100px;margin:auto}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.02;margin:.5rem 0 .75rem;max-width:14ch}
.lede{color:var(--mute);max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.5rem;margin-top:2rem}
.cardlink{color:inherit;text-decoration:none;display:block}.cardlink:hover h3,.cardlink:focus-visible h3{text-decoration:underline}
.swatch{aspect-ratio:1;display:grid;place-items:center;margin-bottom:.75rem;background:#E3E9E8;border-radius:var(--r)}
.phone{width:42%;aspect-ratio:9/18;border-radius:14px;border:3px solid var(--ink)}
.item img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:var(--r);margin-bottom:.75rem}
.item h3{margin:0}.item p{margin:.2rem 0 .6rem;color:var(--mute);font-size:.95rem}.brand{color:var(--mute);font-size:.85rem}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem;margin-top:1rem}
.big{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:var(--r)}
.thumbs{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}.th{padding:2px;width:64px;height:64px;background:#fff}.th img{width:100%;height:100%;object-fit:contain}
.soldout{color:#B0382E;font-weight:700}.ok{color:#2E7D5B}
button,.btn{font:inherit;background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:.6rem 1.1rem;cursor:pointer}
button.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse}td,th{padding:.6rem 0;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
form{display:grid;gap:.9rem;max-width:420px}label{display:grid;gap:.25rem;font-size:.95rem}
label.radio{display:flex;gap:.5rem;align-items:center}
input{font:inherit;padding:.6rem;border:1px solid var(--line);border-radius:var(--r);background:#fff}input[type=radio]{padding:0}
.msg{padding:.8rem 1rem;border-radius:var(--r);background:#E2E8FF;margin:1rem 0}.err{background:#FBE3E0}
@media (prefers-reduced-motion:no-preference){.item .swatch,.item img{transition:transform .2s}.item:hover .swatch,.item:hover img{transform:rotate(-2deg)}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">Phone Mart</a>
  <nav style="display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap">
    <a href="#/">Shop</a><a href="#/orders">My orders</a><a href="#/cart" id="cartlink">Cart (0)</a>
    <a href="/admin.html" id="adminlink" hidden>Admin</a><span id="authbox"></span>
  </nav>
</header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const money = (c) => new Intl.NumberFormat("en-NG", { style: "currency", currency: "NGN" }).format(c / 100);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let sb, session, cfg = {}, products = [], cart = JSON.parse(localStorage.getItem("cart") || "{}");
const saveCart = () => { localStorage.setItem("cart", JSON.stringify(cart)); $("#cartlink").textContent = `Cart (${Object.values(cart).reduce((a, b) => a + b, 0)})`; };
const api = async (path, opts = {}) => {
  const r = await fetch("/api/" + path, { ...opts, headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session.access_token } : {}) } });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || "Something went wrong"); return j;
};
const signIn = () => sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
const lines = () => Object.entries(cart).map(([id, qty]) => ({ p: products.find((x) => x.id === id), qty })).filter((l) => l.p);
const total = () => lines().reduce((t, l) => t + l.p.price_cents * l.qty, 0);
const stockText = (p) => p.stock <= 0 ? `<span class="soldout">Sold out</span>` : p.stock <= 5 ? `<span class="soldout">Only ${p.stock} left</span>` : `<span class="ok">In stock</span>`;
const thumb = (p) => p.images?.[0] ? `<img src="${esc(p.images[0])}" alt="${esc(p.name)}">` : `<div class="swatch"><div class="phone" style="background:${esc(p.color)}"></div></div>`;

async function checkAdmin() { $("#adminlink").hidden = true; if (!session) return; try { $("#adminlink").hidden = !(await api("me")).isAdmin; } catch {} }
function authBox() {
  checkAdmin();
  $("#authbox").innerHTML = session ? `<button class="ghost" id="out">Sign out</button>` : `<button id="in">Sign in with Google</button>`;
  $("#out")?.addEventListener("click", () => sb.auth.signOut());
  $("#in")?.addEventListener("click", signIn);
}

const doneMsg = () => {
  const q = new URLSearchParams(location.hash.split("?")[1]), pay = q.get("pay"), mail = q.get("mail") === "1";
  if (pay === "failed") return `<h1>Payment not confirmed</h1><div class="msg err">We couldn't confirm your payment. If you were charged, check My orders in a minute or contact the shop.</div>`;
  return `<h1>${pay === "paid" ? "Payment received" : "Order placed"}</h1><div class="msg">${pay === "paid" ? "Your order is confirmed." : "Pay when your phone is delivered."} ${mail ? "A confirmation email is on its way." : "We couldn't send the confirmation email, but your order is saved."}</div>`;
};
const statusLabel = { awaiting_payment: "Awaiting payment", paid: "Paid", pending: "Pay on delivery" };

const views = {
  "/": () => `<h1>Phones you can trust, at fair prices.</h1><p class="lede">Browse the latest phones from Apple, Samsung, Google, Tecno and more.</p>
    <div class="grid">${products.map((p) => `<div class="item"><a class="cardlink" href="#/p/${p.id}">${thumb(p)}<div class="brand">${esc(p.brand)}</div><h3>${esc(p.name)}</h3></a><p>${esc(p.specs || p.description)}</p><b>${money(p.price_cents)}</b> ${p.stock > 0 ? `<button data-add="${p.id}">Add to cart</button>` : stockText(p)}</div>`).join("")}</div>`,
  detail: (id) => {
    const p = products.find((x) => x.id === id);
    if (!p) return `<h1>Phone not found</h1><a href="#/">Back to the shop</a>`;
    const imgs = p.images || [];
    return `<p><a href="#/">← All phones</a></p><div class="detail"><div>${imgs.length
      ? `<img id="mainimg" class="big" src="${esc(imgs[0])}" alt="${esc(p.name)}"><div class="thumbs">${imgs.map((u, i) => `<button class="ghost th" data-view="${esc(u)}" aria-label="Show view ${i + 1}"><img src="${esc(u)}" alt=""></button>`).join("")}</div>`
      : `<div class="swatch big"><div class="phone" style="background:${esc(p.color)}"></div></div>`}</div>
      <div><div class="brand">${esc(p.brand)}</div><h1 style="max-width:none;font-size:2.4rem">${esc(p.name)}</h1>
      <p><b style="font-size:1.5rem">${money(p.price_cents)}</b></p><p>${stockText(p)}</p>
      <p><b>${esc(p.specs)}</b></p><p>${esc(p.description)}</p>
      ${p.stock > 0 ? `<button data-add="${p.id}">Add to cart</button> <a href="#/cart">View cart</a>` : ""}</div></div>`;
  },
  "/cart": () => !lines().length ? `<h1>Your cart is empty</h1><p><a href="#/">Browse the shop</a></p>` :
    `<h1>Your cart</h1><table><tr><th>Item</th><th>Qty</th><th class="r">Price</th></tr>${lines().map((l) => `<tr><td><a href="#/p/${l.p.id}">${esc(l.p.name)}</a></td><td><button class="ghost" data-dec="${l.p.id}" aria-label="Remove one">−</button> ${l.qty} <button class="ghost" data-add="${l.p.id}" aria-label="Add one">+</button></td><td class="r">${money(l.p.price_cents * l.qty)}</td></tr>`).join("")}<tr><td colspan="2"><b>Total</b></td><td class="r"><b>${money(total())}</b></td></tr></table><p><a class="btn" href="#/checkout" style="text-decoration:none">Go to checkout</a></p>`,
  "/checkout": () => !lines().length ? `<h1>Your cart is empty</h1><p><a href="#/">Browse the shop</a></p>` :
    `<h1>Checkout</h1><p class="lede">${lines().map((l) => `${esc(l.p.name)} × ${l.qty}`).join(", ")} — <b>${money(total())}</b></p>` +
    (!session ? `<p>Sign in so we can email your confirmation.</p><button id="in2">Sign in with Google</button>` :
    `<div id="status"></div><form id="co"><label>Full name<input name="name" required autocomplete="name"></label><label>Street address<input name="address" required autocomplete="street-address"></label><label>City<input name="city" required autocomplete="address-level2"></label>
    <fieldset style="border:1px solid var(--line);border-radius:6px"><legend>Payment</legend>${cfg.paystack ? `<label class="radio"><input type="radio" name="pay" value="paystack" checked> Pay online (card or bank transfer)</label>` : ""}<label class="radio"><input type="radio" name="pay" value="cod" ${cfg.paystack ? "" : "checked"}> Pay on delivery</label></fieldset>
    <p style="margin:0;color:var(--mute)">Confirmation goes to ${esc(session.user.email)}.</p><button>Place order</button></form>`),
  "/orders": () => `<h1>My orders</h1><div id="orders">${session ? "Loading…" : `<p>Sign in to see your orders.</p><button id="in2">Sign in with Google</button>`}</div>`,
  "/done": doneMsg,
};

async function render() {
  const path = location.hash.slice(1).split("?")[0] || "/";
  $("#app").innerHTML = path.startsWith("/p/") ? views.detail(path.slice(3)) : (views[path] || views["/"])();
  scrollTo(0, 0);
  $("#in2")?.addEventListener("click", signIn);
  if (path === "/orders" && session) {
    try { const o = await api("orders"); $("#orders").innerHTML = o.length ? o.map((x) => `<h3>${new Date(x.created_at).toLocaleDateString()} — ${money(x.total_cents)} <small>(${statusLabel[x.status] || x.status})</small></h3><p>${x.order_items.map((i) => `${esc(i.name)} × ${i.qty}`).join(", ")}</p>`).join("") : `<p>No orders yet.</p>`; }
    catch (e) { $("#orders").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }
  $("#co")?.addEventListener("submit", async (e) => {
    e.preventDefault(); const btn = e.target.querySelector("button:not(.ghost)"); btn.disabled = true;
    const f = Object.fromEntries(new FormData(e.target)), { pay, ...shipping } = f;
    try {
      const r = await api("orders", { method: "POST", body: JSON.stringify({ items: lines().map((l) => ({ id: l.p.id, qty: l.qty })), shipping, method: pay }) });
      if (r.url) { location.href = r.url; return; }
      cart = {}; saveCart(); location.hash = `#/done?mail=${r.emailSent ? 1 : 0}&pay=cod`;
    } catch (err) { $("#status").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; btn.disabled = false; }
  });
}
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]"); if (v) { $("#mainimg").src = v.dataset.view; return; }
  const a = e.target.dataset.add, d = e.target.dataset.dec;
  if (a) {
    const p = products.find((x) => x.id === a);
    if (!p || (cart[a] || 0) >= p.stock) { e.target.textContent = "All in cart"; return; }
    cart[a] = (cart[a] || 0) + 1; saveCart(); if (location.hash.includes("cart")) render(); else e.target.textContent = "Added";
  }
  if (d) { cart[d] = (cart[d] || 1) - 1; if (cart[d] <= 0) delete cart[d]; saveCart(); render(); }
});
addEventListener("hashchange", render);

(async () => {
  cfg = await (await fetch("/api/config")).json();
  sb = supabase.createClient(cfg.url, cfg.anonKey);
  ({ data: { session } } = await sb.auth.getSession());
  sb.auth.onAuthStateChange((_, s) => { session = s; authBox(); if (!location.hash.startsWith("#/done")) render(); });
  products = await api("products").catch(() => []);
  const ref = new URLSearchParams(location.search).get("reference");
  if (ref && session) {   // returning from Paystack
    let hash = "#/done?pay=failed";
    try { const r = await api("orders/verify?reference=" + encodeURIComponent(ref)); if (r.status === "paid") { cart = {}; hash = `#/done?pay=paid&mail=${r.emailSent ? 1 : 0}`; } } catch {}
    history.replaceState(null, "", location.pathname); location.hash = hash;
  }
  saveCart(); authBox(); render();
})();
</script>
</body>
</html>
