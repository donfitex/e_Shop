<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Mart admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F1F4F3;--ink:#1F2A44;--mute:#5E6B7A;--line:#CBD5D3;--accent:#2B4FD8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{display:flex;gap:1rem;align-items:center;padding:1rem 5vw;border-bottom:1px solid var(--line)}header b{margin-right:auto;font-size:1.2rem}
main{max-width:1000px;margin:auto;padding:1.5rem 5vw 4rem}h2{margin:2rem 0 .5rem}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem;background:#fff;padding:1rem;border-radius:8px;border:1px solid var(--line)}
label{display:grid;gap:.2rem;font-size:.9rem}.wide{grid-column:1/-1}
input,textarea{font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:6px}input[type=color]{padding:0;height:2.3rem}input[type=checkbox]{width:1.2rem;height:1.2rem}
button{font:inherit;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:.5rem .9rem;cursor:pointer}button.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}button.sm{padding:.15rem .5rem;font-size:.8rem}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:.5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.msg{padding:.7rem 1rem;border-radius:6px;background:#E2E8FF;margin:1rem 0}.err{background:#FBE3E0}.dim{color:var(--mute)}
.imgs{display:flex;gap:.6rem;flex-wrap:wrap}.im{width:110px;text-align:center;font-size:.8rem}.im img{width:110px;height:110px;object-fit:contain;background:#F1F4F3;border-radius:6px;border:1px solid var(--line)}
</style></head><body>
<header><b>Phone Mart admin</b><a href="/">View shop</a><span id="auth"></span></header>
<main id="app"><p>Loading…</p></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const money = (c) => new Intl.NumberFormat("en-NG", { style: "currency", currency: "NGN" }).format(c / 100);
const label = { awaiting_payment: "Awaiting payment", paid: "Paid", pending: "Pay on delivery" };
let sb, session, items = [], editId = null, formImages = [];
const api = async (path, method = "GET", body) => {
  const r = await fetch("/api/" + path, { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: body && JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || "Something went wrong"); return j;
};
const note = (t, err) => ($("#note").innerHTML = t ? `<div class="msg ${err ? "err" : ""}">${esc(t)}</div>` : "");

function shell() {
  $("#app").innerHTML = `<div id="note"></div><h2 id="ftitle">Add a phone</h2>
  <form id="f">
    <label>Name<input name="name" required placeholder="iPhone 15"></label>
    <label>Brand<input name="brand" placeholder="Apple"></label>
    <label>Price (₦)<input name="price" type="number" min="0" step="0.01" required></label>
    <label>Stock (units)<input name="stock" type="number" min="0" step="1" value="10" required></label>
    <label class="wide">Specs<input name="specs" placeholder='6.1" · 128GB · 6GB RAM'></label>
    <label class="wide">Description<textarea name="description" rows="2"></textarea></label>
    <div class="wide"><label>Photos: front, back, side… (JPG, PNG or WebP, up to 8, 6 MB each)<input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple></label>
      <div class="imgs" id="imgs"></div></div>
    <label>Colour swatch (used when there are no photos)<input name="color" type="color" value="#2F3B4C"></label>
    <label><span><input type="checkbox" name="active" checked> Show in shop</span></label>
    <div class="wide"><button id="save">Save phone</button> <button type="button" class="ghost" id="cancel" hidden>Cancel edit</button></div>
  </form>
  <h2>Phones</h2><div style="overflow-x:auto"><table id="plist"></table></div>
  <h2>Recent orders</h2><div style="overflow-x:auto"><table id="olist"></table></div>`;
  $("#f").addEventListener("submit", save);
  $("#cancel").addEventListener("click", resetForm);
  $("#files").addEventListener("change", upload);
  drawImgs();
}
function drawImgs() {
  $("#imgs").innerHTML = formImages.map((u, i) => `<div class="im"><img src="${esc(u)}" alt="Photo ${i + 1}"><div>${i === 0 ? "<b>Main</b>" : `<button type="button" class="ghost sm" data-first="${i}">Make main</button>`} <button type="button" class="ghost sm" data-rm="${i}">Remove</button></div></div>`).join("");
}
async function upload(e) {
  const files = [...e.target.files]; e.target.value = "";
  for (const file of files) {
    if (formImages.length >= 8) { note("Up to 8 photos per phone.", true); break; }
    note("Uploading " + file.name + "…");
    try {
      const r = await fetch("/api/admin/upload", { method: "POST", headers: { "Content-Type": file.type, Authorization: "Bearer " + session.access_token }, body: file });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      formImages.push(j.url); drawImgs(); note("");
    } catch (err) { note(file.name + ": " + err.message, true); }
  }
}
function resetForm() { editId = null; formImages = []; $("#f").reset(); drawImgs(); $("#ftitle").textContent = "Add a phone"; $("#cancel").hidden = true; }

async function save(e) {
  e.preventDefault(); const f = e.target, d = Object.fromEntries(new FormData(f)); d.active = f.active.checked; d.images = formImages;
  try { await api("admin/products" + (editId ? "/" + editId : ""), editId ? "PUT" : "POST", d); const was = editId; resetForm(); note(was ? "Phone updated." : "Phone added."); load(); }
  catch (err) { note(err.message, true); }
}
function edit(id) {
  const p = items.find((x) => x.id === id), f = $("#f"); editId = id; formImages = [...(p.images || [])];
  f.name.value = p.name; f.brand.value = p.brand; f.price.value = p.price_cents / 100; f.stock.value = p.stock; f.color.value = p.color;
  f.specs.value = p.specs; f.description.value = p.description; f.active.checked = p.active; drawImgs();
  $("#ftitle").textContent = "Edit " + p.name; $("#cancel").hidden = false; scrollTo({ top: 0 });
}
const asBody = (p, over = {}) => ({ ...p, price: p.price_cents / 100, ...over });
async function load() {
  try {
    items = await api("admin/products");
    $("#plist").innerHTML = `<tr><th>Phone</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>` + items.map((p) => `<tr><td><b>${esc(p.name)}</b><br><span class="dim">${esc(p.brand)} ${esc(p.specs)} · ${(p.images || []).length} photo(s)</span></td><td>${money(p.price_cents)}</td><td>${p.stock}</td><td>${p.active ? "Shown" : "Hidden"}</td><td><button class="ghost sm" data-e="${p.id}">Edit</button> <button class="ghost sm" data-t="${p.id}">${p.active ? "Hide" : "Show"}</button> <button class="ghost sm" data-d="${p.id}">Delete</button></td></tr>`).join("");
    const o = await api("admin/orders");
    $("#olist").innerHTML = `<tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th></tr>` + (o.map((x) => `<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.shipping.name)}<br><span class="dim">${esc(x.email)}<br>${esc(x.shipping.address)}, ${esc(x.shipping.city)}</span></td><td>${x.order_items.map((i) => `${esc(i.name)} × ${i.qty}`).join("<br>")}</td><td>${money(x.total_cents)}</td><td>${label[x.status] || esc(x.status)}</td></tr>`).join("") || `<tr><td colspan="5" class="dim">No orders yet.</td></tr>`);
  } catch (err) { note(err.message, true); }
}
document.addEventListener("click", async (e) => {
  const { e: ed, t, d, first, rm } = e.target.dataset;
  if (first !== undefined) { const [u] = formImages.splice(+first, 1); formImages.unshift(u); drawImgs(); }
  if (rm !== undefined) { formImages.splice(+rm, 1); drawImgs(); }
  if (ed) edit(ed);
  if (t) { const p = items.find((x) => x.id === t); try { await api("admin/products/" + t, "PUT", asBody(p, { active: !p.active })); load(); } catch (err) { note(err.message, true); } }
  if (d && confirm("Delete this phone?")) { try { await api("admin/products/" + d, "DELETE"); note("Deleted."); load(); } catch (err) { note(err.message, true); } }
});

(async () => {
  const cfg = await (await fetch("/api/config")).json();
  sb = supabase.createClient(cfg.url, cfg.anonKey);
  ({ data: { session } } = await sb.auth.getSession());
  if (!session) { $("#app").innerHTML = `<p>Sign in with an admin Google account.</p><button id="in">Sign in with Google</button>`; $("#in").onclick = () => sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href } }); return; }
  $("#auth").innerHTML = `<button class="ghost" id="out">Sign out</button>`; $("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  try { const me = await api("me"); if (!me.isAdmin) throw 0; } catch { $("#app").innerHTML = `<div class="msg err">This account isn't an admin. Add its email to ADMIN_EMAILS in .env and restart the server.</div>`; return; }
  shell(); load();
})();
</script></body></html>
